# ToolShare API and MongoDB services
services :
  mongodb:
    image: mongo:7.0
    container_name: toolshare_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    command: ["--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test: mongosh --port 27017 --quiet --eval 'try { rs.status(); } catch (e) { rs.initiate({_id:"rs0",members:[{_id:0,host:"mongodb:27017"}]}); }'
      interval: 5s
      timeout: 5s
      retries: 5
  api:
    build: .
    container_name: toolshare_api
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file: .env
    volumes:
      - ./:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      mongodb:
        condition: service_healthy
volumes:
  mongo_data:
